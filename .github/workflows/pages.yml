name: Deploy GitHub Pages

on:
  push:
    branches:
      - dev
      - "cursor/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Publishes dist onto main (Pages). Never merge source into main.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: main
          clean: true
          clean-exclude: |
            README.md
            .nojekyll
          commit-message: "Publish Trajectry web build to GitHub Pages"
